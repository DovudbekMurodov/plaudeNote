[package]
name = "plaudenote"
version = "0.2.0"
description = "Local-first AI voice notes"
edition = "2021"
rust-version = "1.85"

[lib]
name = "plaudenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
chrono = "0.4.45"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "rt-multi-thread", "macros", "time", "sync", "process"] }
futures-util = "0.3.34"
flate2 = "1.1.10"
tar = "0.4.46"
sysinfo = "0.36.1"
cpal = "0.18.2"
hound = "3.5.1"
whisper-rs = { version = "0.16", features = ["metal"] }
embed_plist = "1.2.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "mkv", "flac", "wav", "pcm", "vorbis", "ogg", "alac"] }
dirs = "7.0.0"
opus = "0.4.0"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Resampling / decoding in an unoptimised build is painfully slow.
[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
